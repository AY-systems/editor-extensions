name: Test packages

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/**"
      - ".changeset/**"
      - "scripts/version-management/**"
      - "packages/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "tsconfig*.json"

  pull_request:
    paths:
      - ".github/workflows/**"
      - ".changeset/**"
      - "scripts/version-management/**"
      - "packages/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "tsconfig*.json"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: 22
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check formatting, lint, and types
        run: vp check

      - name: Test version tag management
        run: node --test scripts/version-management/tags.test.mjs

      - name: Run tests
        run: vp test --dom

      - name: Build packages
        run: vp run build
