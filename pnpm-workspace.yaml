packages:
  - packages/*
  - demos/*

# クールダウンの設定(7日)
minimumReleaseAge: 10080 # 7日（分単位）

catalogMode: strict

catalog:
  "@types/node": ^24

  "@tiptap/extension-image": ^3.31.0
  "@tiptap/core": ^3.31.0
  "@tiptap/pm": ^3.31.0
  "@tiptap/starter-kit": "^3.31.0"
  "@tiptap/vue-3": "^3.31.0"

  happy-dom: ^20.8.3

  typescript: 6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
  vue-tsc: ^3.0.8

  #demo's dependencies
  "@tailwindcss/vite": "^4.3.3"
  "@vitejs/plugin-vue": "^6.0.8"
  "tailwindcss": ^4.3.3
  vue: ^3.5.41

overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
